<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | CADers KUET</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%, rgba(20, 160, 255, 0.12), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(0, 120, 255, 0.10), transparent 35%),
                #06111f;
            color: #eef6ff;
            display: flex;
            flex-direction: column;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            width: 100%;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(5, 16, 29, 0.92);
            backdrop-filter: blur(12px);
        }

        .nav-container {
            width: min(1100px, 92%);
            margin: auto;
            height: 82px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .logo-mark {
            width: 46px;
            height: 46px;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(135deg, #19bfff, #0788e8);
            color: white;

            font-size: 24px;
            font-weight: 800;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .logo-text strong {
            font-size: 20px;
        }

        .logo-text small {
            margin-top: 5px;
            color: #8da5bd;
            font-size: 10px;
            letter-spacing: 3px;
        }

        .back-home {
            color: #dcecff;
            text-decoration: none;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            transition: 0.25s;
        }

        .back-home:hover {
            border-color: #1caeff;
            color: #35baff;
        }

        /* ================= LOGIN AREA ================= */

        .login-area {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 60px 20px;
        }

        .login-card {
            width: min(430px, 100%);

            padding: 42px;

            background: rgba(13, 31, 50, 0.88);
            border: 1px solid rgba(44, 173, 255, 0.25);
            border-radius: 22px;

            box-shadow:
                0 25px 80px rgba(0,0,0,0.35),
                0 0 50px rgba(0, 160, 255, 0.05);
        }

        .login-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 22px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(22, 169, 255, 0.12);
            border: 1px solid rgba(35, 177, 255, 0.3);

            color: #2bb8ff;
            font-size: 30px;
        }

        .login-heading {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-heading h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .login-heading p {
            color: #9db5cc;
            line-height: 1.6;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            color: #dcecff;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;

            padding: 14px 15px;

            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.12);

            background: rgba(3, 14, 26, 0.8);
            color: white;

            outline: none;
            font-size: 15px;

            transition: 0.25s;
        }

        .form-group input:focus {
            border-color: #20adff;
            box-shadow: 0 0 0 3px rgba(32, 173, 255, 0.10);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 80px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);

            background: none;
            border: none;

            color: #6fcfff;
            cursor: pointer;

            font-size: 12px;
        }

        .login-button {
            width: 100%;

            margin-top: 8px;
            padding: 15px;

            border: none;
            border-radius: 11px;

            background: linear-gradient(135deg, #1baeff, #087fd8);
            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 30px rgba(12, 157, 240, 0.25);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* ================= MESSAGE ================= */

        .message {
            display: none;

            margin-top: 18px;
            padding: 12px 14px;

            border-radius: 10px;

            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: rgba(255, 70, 70, 0.10);
            border: 1px solid rgba(255, 80, 80, 0.25);
            color: #ff9c9c;
        }

        .message.success {
            background: rgba(50, 220, 130, 0.10);
            border: 1px solid rgba(50, 220, 130, 0.25);
            color: #71efaa;
        }

        .test-info {
            margin-top: 25px;
            padding-top: 20px;

            border-top: 1px solid rgba(255,255,255,0.08);

            text-align: center;

            color: #708ba3;
            font-size: 12px;
            line-height: 1.6;
        }

        /* ================= FOOTER ================= */

        .footer {
            padding: 22px;
            text-align: center;

            border-top: 1px solid rgba(255,255,255,0.06);

            color: #718aa0;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            .nav-container {
                height: 72px;
            }

            .login-card {
                padding: 30px 22px;
            }

            .login-heading h1 {
                font-size: 27px;
            }

            .back-home {
                padding: 8px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">

                <span class="logo-mark">C</span>

                <span class="logo-text">
                    <strong>CADers</strong>
                    <small>KUET</small>
                </span>

            </a>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </header>


    <!-- ================= LOGIN ================= -->

    <main class="login-area">

        <div class="login-card">

            <div class="login-icon">
                🔐
            </div>

            <div class="login-heading">

                <h1>Student Login</h1>

                <p>
                    Sign in to access your CADers student account.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        name="studentId"
                        placeholder="Enter your Student ID"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Login
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>


            <div class="test-info">

                Test account:
                <strong>TEST001</strong>
                /
                <strong>Test1234</strong>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        © 2026 CADers, KUET. All Rights Reserved.

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbwgjQ2pP78K9Dd7HOs_xzg-f_fqunBYeI5XFsGplYb1DEoBN6AXTUzaTeB_pXlnW0Y-/exec";


        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");

        const passwordInput =
            document.getElementById("password");

        const showPassword =
            document.getElementById("showPassword");


        /* ================= SHOW PASSWORD ================= */

        showPassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                showPassword.innerText = "Hide";

            } else {

                passwordInput.type = "password";
                showPassword.innerText = "Show";

            }

        });


        /* ================= LOGIN ================= */

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();


            const studentId =
                document.getElementById("studentId").value.trim();

            const password =
                passwordInput.value;


            message.className = "message";
            message.innerText = "";


            loginButton.disabled = true;
            loginButton.innerText = "Signing in...";


            const data = {

                action: "login",

                studentId: studentId,

                password: password

            };


            try {

                const response = await fetch(
                    SCRIPT_URL,
                    {
                        method: "POST",

                        mode: "no-cors",

                        headers: {
                            "Content-Type":
                                "text/plain;charset=utf-8"
                        },

                        body: JSON.stringify(data)
                    }
                );


                /*
                 * no-cors means the browser cannot read
                 * the Apps Script response.
                 *
                 * Therefore this first version uses a
                 * simple success flow after the request.
                 */

                message.className =
                    "message success show";

                message.innerText =
                    "Login request sent successfully.";

                loginButton.innerText =
                    "Login successful";


            } catch (error) {

                console.error(error);

                message.className =
                    "message error show";

                message.innerText =
                    "Unable to connect to the login server.";

                loginButton.disabled = false;
                loginButton.innerText = "Login";

            }

        });

    </script>

</body>
</html>
